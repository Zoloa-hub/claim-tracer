name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # macOS runner 上多版本开销大，覆盖一个即可
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 契约：**零第三方依赖**。所以这里刻意什么都不装 ——
      # 一旦有人加了依赖，这个 job 会立刻失败，而不是等到用户装不上时才发现。
      - name: No dependencies installed
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pip", "list", "--format=freeze"],
                               capture_output=True, text=True).stdout.lower()
          for forbidden in ("numpy", "pandas", "scipy", "requests", "pytest"):
              if forbidden in out:
                  print(f"::error::{forbidden} is present in the base environment; "
                        f"the zero-dependency claim cannot be verified here")
                  sys.exit(1)
          print("base environment is dependency-free")
          PY

      - name: Install the package
        run: python -m pip install -e .

      - name: Run the test suite
        run: python tests/test_claim_tracer.py

      - name: CLI is on PATH and self-documents
        shell: bash
        run: |
          claim-tracer --help
          claim-tracer --help | grep -qi "RANGE check" \
            || { echo "::error::--help must state that this is a range check, not a correctness check"; exit 1; }

  packaging:
    name: packaging (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run it
        shell: bash
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install --quiet dist/*.whl
          /tmp/v/bin/claim-tracer --help > /dev/null
          echo "wheel installs and the console script runs"