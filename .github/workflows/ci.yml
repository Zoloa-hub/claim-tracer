name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          # macOS runner 上多版本开销大，覆盖一个即可
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 契约：**零第三方依赖**。
      #
      # 早期写法是 `pip list` 扫整台机器有没有 numpy/pytest —— 那验证的是
      # **环境恰好干净**（环境事实），不是**我们的包不依赖任何东西**（契约本身）。
      # 它当时碰巧通过了，但换个 runner 镜像就可能红，而红的原因与我们的承诺无关。
      # 这类「把环境事实当断言」的检查已反复出现，所以改为问打包元数据。
      - name: Package declares zero dependencies
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import sys
          import tomllib

          requires = md.requires("claim-tracer") or []
          if requires:
              print(f"::error::claim-tracer declares dependencies: {requires}")
              sys.exit(1)

          # 与 pyproject 交叉核对，防止元数据与实际声明不一致
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = data["project"].get("dependencies") or []
          if declared:
              print(f"::error::pyproject declares dependencies: {declared}")
              sys.exit(1)

          optional = data["project"].get("optional-dependencies") or {}
          print("contract holds: claim-tracer declares no dependencies")
          print(f"optional groups: {sorted(optional) or 'none'}")
          PY

      - name: Install the package
        run: python -m pip install -e .

      - name: Run the test suite
        run: python tests/test_claim_tracer.py

      - name: CLI is on PATH and self-documents
        shell: bash
        run: |
          claim-tracer --help
          claim-tracer --help | grep -qi "RANGE check" \
            || { echo "::error::--help must state that this is a range check, not a correctness check"; exit 1; }

  packaging:
    name: packaging (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run it
        shell: bash
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install --quiet dist/*.whl
          /tmp/v/bin/claim-tracer --help > /dev/null
          echo "wheel installs and the console script runs"